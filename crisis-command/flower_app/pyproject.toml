[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crisis-command"
version = "0.1.0"
description = "Multi-agent emergency dispatch system with safety validation and autonomous replanning."
license = { file = "LICENSE" }
requires-python = ">=3.11"

dependencies = [
    "flwr>=1.35.0,<2.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1"
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "fatimawaseem1111@gmail.com"
display-name = "Crisis Command"
flwr-version-target = "1.35.0"

fab-include = [
    "flower_app/**/*.py",
    "agents/**/*.py",
    "main.py"
]

[tool.flwr.app.config.agent]
input = """
Severe flooding reported in Sector 4.
Approximately 200 civilians are isolated.
Ground access is unavailable.
Emergency water and trauma supplies required.
Runway is flooded.
Helicopter landing area remains accessible.
"""

[tool.flwr.app.config.crisis]
demo = true

[tool.flwr.app.components]
agentapp = "flower_app.agent_app:app"
