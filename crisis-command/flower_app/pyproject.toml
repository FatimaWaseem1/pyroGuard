[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crisis-command"
version = "0.1.0"
description = "Multi-agent emergency dispatch system with deterministic safety validation and autonomous replanning."
license = { file = "LICENSE" }
requires-python = ">=3.11"

dependencies = [
    "flwr>=1.35.0,<2.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1"
]

[tool.setuptools]
packages = ["agents", "flower_app"]
py-modules = ["main"]

[tool.flwr.app]
publisher = "YOUR_FLOWER_USERNAME"
display-name = "Crisis Command"
flwr-version-target = "1.35.0"

[tool.flwr.app.config.agent]
input = """
Severe flooding reported in Sector 4.
Approximately 200 civilians are isolated.
Ground access is unavailable.
Emergency water and trauma supplies required.
Runway is flooded. Helicopter landing area remains accessible.
"""

[tool.flwr.app.config.crisis]
demo = true

[tool.flwr.app.components]
agentapp = "flower_app.agent_app:app"
