[project]
name = "crisis-command"
version = "0.1.0"
description = "Multi-agent autonomous emergency dispatch system on AMD MI300X infrastructure"
authors = [{ name = "Crisis Command Team" }]
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1"
]
requires-python = ">=3.10"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"